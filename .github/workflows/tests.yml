name: tests

on:
  push:
  pull_request:

jobs:
  lint-and-test:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.11"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Lint
        run: |
          ruff check lastfmsummary tests
          ruff format --check lastfmsummary tests
      - name: Test
        run: pytest -q

  red-cog-tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Install Red and test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install "Red-DiscordBot @ git+https://github.com/Cog-Creators/Red-DiscordBot.git@V3/develop"
          pip install -e ".[dev]"
      - name: Cog wiring tests
        run: pytest tests/test_cog.py -q

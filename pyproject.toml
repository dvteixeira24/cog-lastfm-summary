[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cog-lastfm-summary"
version = "1.2.0"
description = "A Red-DiscordBot cog that posts periodic server-wide Last.fm summaries"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "OpenCode" }]
dependencies = ["Pillow>=10.1", "tzdata", "aiohttp>=3.8"]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "ruff>=0.6",
]

[tool.hatch.build.targets.wheel]
packages = ["lastfmsummary"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "SIM"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["lastfmsummary"]
